---
binaries_dest: "{{ ansible_env.HOME }}/.local/bin"

apps_dest: "{{ ansible_env.HOME }}/Downloads"

# Apps that aren't a plain CLI binary: downloaded to apps_dest and, when the
# download is a disk image, mounted (left mounted for a manual finish/install).
apps:
  - name: docker-desktop
    kind: dmg
    url: "https://desktop.docker.com/mac/main/arm64/Docker.dmg"
    mount_point: "/Volumes/Docker"

  - name: tart
    version: "2.35.0"
    kind: tar
    url: "https://github.com/cirruslabs/tart/releases/download/@VERSION@/tart.tar.gz"
    members: "tart.app"
    xattr: true

  - name: vscode
    kind: zip
    url: "https://code.visualstudio.com/sha/download?build=stable&os=darwin-arm64"
    members: "Visual Studio Code.app"
    xattr: true

# Each entry mirrors the equivalent curl|tar/unzip one-liner from README.md.
# kind: raw (single executable download), tar (tar.gz/tar.bz2), zip
binaries:
  - name: aria2c
    version: "1.35.0"
    kind: tar
    url: "https://github.com/aria2/aria2/releases/download/release-@VERSION@/aria2-@VERSION@-osx-darwin.tar.bz2"
    strip_components: 2
    members: "aria2-@VERSION@/bin/aria2c"
    xattr: true

  - name: cilium
    version: "v0.19.7"
    kind: tar
    url: "https://github.com/cilium/cilium-cli/releases/download/@VERSION@/cilium-darwin-arm64.tar.gz"

  - name: duckdb
    version: "v1.5.5"
    kind: zip
    url: "https://github.com/duckdb/duckdb/releases/download/@VERSION@/duckdb_cli-osx-universal.zip"
    members: "duckdb"

  - name: helm
    version: "4.2.4"
    kind: tar
    url: "https://get.helm.sh/helm-v@VERSION@-darwin-arm64.tar.gz"
    strip_components: 1
    members: "darwin-arm64/helm"

  - name: hubble
    version: "v1.19.4"
    kind: tar
    url: "https://github.com/cilium/hubble/releases/download/@VERSION@/hubble-darwin-arm64.tar.gz"

  - name: jj
    version: "v0.44.0"
    kind: tar
    url: "https://github.com/jj-vcs/jj/releases/download/@VERSION@/jj-@VERSION@-aarch64-apple-darwin.tar.gz"
    members: "jj"

  - name: jq
    version: "1.8.2"
    kind: raw
    url: "https://github.com/jqlang/jq/releases/download/jq-@VERSION@/jq-macos-arm64"
    xattr: true

  - name: k9s
    version: "v0.51.0"
    kind: tar
    url: "https://github.com/derailed/k9s/releases/download/@VERSION@/k9s_Darwin_arm64.tar.gz"
    members: "k9s"

  - name: kubectl
    version: "v1.36.4"
    kind: raw
    url: "https://dl.k8s.io/release/@VERSION@/bin/darwin/arm64/kubectl"

  - name: rage
    version: "v0.12.1"
    kind: tar
    url: "https://github.com/str4d/rage/releases/download/@VERSION@/rage-@VERSION@-arm64-darwin.tar.gz"
    strip_components: 1

  - name: ruff
    version: "0.16.4"
    kind: tar
    url: "https://github.com/astral-sh/ruff/releases/download/@VERSION@/ruff-aarch64-apple-darwin.tar.gz"
    strip_components: 1
    members: "ruff-aarch64-apple-darwin/ruff"

  - name: sops
    version: "v3.13.3"
    kind: raw
    url: "https://github.com/getsops/sops/releases/download/@VERSION@/sops-@VERSION@.darwin.arm64"
    xattr: true

  - name: terraform
    version: "1.15.9"
    kind: zip
    url: "https://releases.hashicorp.com/terraform/@VERSION@/terraform_@VERSION@_darwin_arm64.zip"
    members: "terraform"

  - name: terraform-ls
    version: "0.39.0"
    kind: zip
    url: "https://releases.hashicorp.com/terraform-ls/@VERSION@/terraform-ls_@VERSION@_darwin_arm64.zip"
    members: "terraform-ls"

  - name: trivy
    version: "0.74.0"
    kind: tar
    url: "https://github.com/aquasecurity/trivy/releases/download/v@VERSION@/trivy_@VERSION@_macOS-ARM64.tar.gz"
    members: "trivy"

  - name: tspin
    version: "7.0.0"
    kind: tar
    url: "https://github.com/bensadeh/tailspin/releases/download/@VERSION@/tailspin-aarch64-apple-darwin.tar.gz"

  - name: uv
    version: "0.12.5"
    kind: tar
    url: "https://github.com/astral-sh/uv/releases/download/@VERSION@/uv-aarch64-apple-darwin.tar.gz"
    strip_components: 1
    members: "uv-aarch64-apple-darwin/uv uv-aarch64-apple-darwin/uvx"

  - name: vault
    version: "2.0.4"
    kind: zip
    url: "https://releases.hashicorp.com/vault/@VERSION@/vault_@VERSION@_darwin_arm64.zip"
    members: "vault"

  - name: yq
    version: "v4.53.6"
    kind: raw
    url: "https://github.com/mikefarah/yq/releases/download/@VERSION@/yq_darwin_arm64"

  - name: zizmor
    version: "v1.29.0"
    kind: tar
    url: "https://github.com/zizmorcore/zizmor/releases/download/@VERSION@/zizmor-aarch64-apple-darwin.tar.gz"
